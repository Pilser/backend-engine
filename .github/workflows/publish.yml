# Publish: build the worker binary and ship it to npm on version tags.
# Trigger: git tag vX.Y.Z && git push origin vX.Y.Z
# Required GitHub Secret: NPM_TOKEN (npm access token with publish rights:
# npmjs.com → avatar → Access Tokens → Generate New Token → Automation).
# First-time setup: confirm @pilser/backend-engine is free on npm
# (rename in this file + npm/README.md if taken), add NPM_TOKEN, push a tag.

name: Publish

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build --locked
      - name: build release binary
        run: worker-build --release --out-dir "$PWD/build/backend-engine" "$PWD/crates/worker"
      - name: assemble npm package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          DIST="build/backend-engine"
          ls "$DIST/index.js" "$DIST/index_bg.wasm"
          cp npm/README.md npm/wrangler.example.toml "$DIST/"
          python3 - "$DIST" "$VERSION" <<'PYEOF'
          import json, sys
          dist, version = sys.argv[1], sys.argv[2]
          # Patch worker-build's GENERATED package.json (it already has the
          # correct main/files for index.js + index_bg.wasm) instead of
          # replacing it.
          pkg = f"{dist}/package.json"
          data = json.load(open(pkg))
          data["name"] = "@pilser/backend-engine"
          data["version"] = version
          data["description"] = "your backend that you never code (Backend as a dependency): tables, auth, files, cron, recipes, webhooks, AI proxy, MCP control plane on one Cloudflare Worker."
          data["license"] = "MIT"
          data["repository"] = {"type": "git", "url": "https://github.com/Pilser/backend-engine.git"}
          data["keywords"] = ["cloudflare", "workers", "backend", "serverless", "d1", "r2", "mcp"]
          data.setdefault("files", []).extend(
              [f for f in ("README.md", "wrangler.example.toml") if f not in data["files"]]
          )
          json.dump(data, open(pkg, "w"), indent=2)
          print("stamped version", version)
          PYEOF
      - name: wasm size gate (64 MiB Workers limit)
        run: |
          WASM=build/backend-engine/index_bg.wasm
          SIZE=$(stat -c%s "$WASM")
          echo "wasm: $WASM ($SIZE bytes)"
          if [ "$SIZE" -gt 62914560 ]; then
            echo "::error::wasm $SIZE bytes exceeds the 64 MiB Workers limit"; exit 1;
          fi
      - name: "publish to npm (also serves bun: bun uses the npm registry)"
        working-directory: build/backend-engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > ~/.npmrc
          npm publish --access public
