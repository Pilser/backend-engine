[workspace]
resolver = "2"
# engine = the keeper core. mcp = pure JSON-RPC tool layer (transport deleted).
# worker (package `backend-engine`) = the Cloudflare Worker shell
# (fetch/scheduled/queue/DO + D1/R2 adapters). NOTE: `cargo check` on the
# shell needs the wasm target (AGENTS.md); native workspace checks exclude it.
# The donor crates (server/cli/helixdb) were harvested (route tables, CORS,
# backoff math — see PORT-TRACK.md) and deleted in Phase 8; their content
# survives in git history.
members = ["crates/engine", "crates/mcp", "crates/worker"]

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
# Pure-Rust RSA for OIDC id_token (RS256) verification — wasm-safe, no OS RNG
# needed for verify-only use. Versions are pinned to rsa 0.9's own tree
# (digest 0.10 / signature 2.x<2.3) — NOT the workspace sha2 0.11, whose
# traits rsa rejects. `signature` is declared directly so the import below
# never depends on rsa's re-exports.
rsa = "0.9"
signature = ">=2.0, <2.3"
sha2_010 = { package = "sha2", version = "0.10", features = ["oid"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
base64 = "0.23"
aes-gcm = "0.11"
rand = "0.10"
uuid = { version = "1", features = ["v4", "js"] }
tracing = "0.1"

# ---- build speed (memory-constrained dev machine) ----------------------
[profile.dev]
# Keep incremental for fast re-checks of our own crates.
incremental = true
# Drop full debuginfo in dev: much less memory during codegen + linking.
debug = 0
# Reduce how much LLVM splits codegen (less memory, marginally slower).
codegen-units = 16
# One opt-level for our crates is a good balance for tests/local runs.
opt-level = 1

# Third-party deps: compile once with 2 so re-builds of OUR crates stay fast.
[profile.dev.package."*"]
opt-level = 2

# Tests inherit dev profile but often need debuginfo to print backtraces.
[profile.test]
debug = 1

# ---- release (edge binary: size is the constraint) -----------------------
# Release builds run in CI only (AGENTS.md) for `worker-build --release`.
# Workers limit: 64 MiB per script — opt-z + thin LTO keep us far under it
# (thin over fat LTO to bound CI link time; revisit if >30 MiB).
# NOTE: never set `strip` here — stripping removes the externref table that
# wasm-bindgen needs for catch wrappers (workers-rs#1014); the build fails
# with "externref table required for catch wrappers". wasm-opt (run by
# worker-build) already shrinks the binary.
[profile.release]
opt-level = "z"
debug = false
codegen-units = 1
lto = "thin"
incremental = false
