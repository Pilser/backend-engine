[package]
name = "mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
engine = { path = "../engine" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "io-util"] }
tracing = { workspace = true }

[features]
default = ["transport-http"]
transport-http = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes"]

[dependencies.hyper]
version = "1"
optional = true
features = ["server", "http1", "http2"]

[dependencies.hyper-util]
version = "0.1"
optional = true
features = ["server-auto", "tokio"]

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.bytes]
version = "1"
optional = true
