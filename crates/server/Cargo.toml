[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
engine = { path = "../engine" }
helixdb = { path = "../helixdb" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking", "http2", "rustls", "stream"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }

[features]
default = ["transport-http"]
transport-http = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:http-body", "dep:http"]
postgres = []
s3 = []
redis = []

[dependencies.hyper]
version = "1"
optional = true
features = ["server", "http1", "http2"]

[dependencies.hyper-util]
version = "0.1"
optional = true
features = ["server-auto", "tokio"]

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.http-body]
version = "1"
optional = true

[dependencies.http]
version = "1"
optional = true

[dependencies.bytes]
version = "1"
optional = true
