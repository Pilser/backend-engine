# Copy to wrangler.toml in your project and fill in the REPLACE_ME values.
# Pairs with: npm i @pilser/backend-engine  (or: bun add @pilser/backend-engine)

name = "my-app"
main = "node_modules/@pilser/backend-engine/index.js"
compatibility_date = "2026-09-01"

[build]
command = "echo 'prebuilt binary — nothing to compile'"

[vars]
ENVIRONMENT = "production"
HTTP_TIMEOUT_MS = "15000"
WORKER_URL = "https://my-app.REPLACE_ME_ACCOUNT.workers.dev"
# AI assistant backend base URL (fallback when the AI_BASE_URL tenant
# secret is absent). Empty = unconfigured.
AI_TARGET = ""

# Storage = bindings, not URLs. Create once, paste ids here:
#   wrangler d1 create my-app
#   wrangler r2 bucket create my-app-store
#   wrangler queues create my-app-deliveries
[[d1_databases]]
binding = "DB"
database_name = "my-app"
database_id = "REPLACE_ME_RUN_WRANGLER_D1_CREATE"

[[r2_buckets]]
binding = "STORE"
bucket_name = "my-app-store"

[[durable_objects.bindings]]
name = "TENANT_DO"
class_name = "TenantDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantDO"]

[[analytics_engine_datasets]]
binding = "USAGE"

[[queues.producers]]
queue = "my-app-deliveries"
binding = "WEBHOOKS"

[[queues.consumers]]
queue = "my-app-deliveries"
max_batch_size = 10
max_batch_timeout = 30

[triggers]
crons = ["*/5 * * * *"]

# Secrets (never in files):
#   wrangler secret put SECRET_KEY   # 32+ random bytes
#   wrangler secret put WORKER_KEY   # admin bearer
