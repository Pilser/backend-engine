# serverless-worker — single tenant (one Worker = one app/user).
# Deploy with: scripts/sync-worker.sh  (or CI: Deploy workflow dispatch)

name = "serverless-worker"
# worker-build (this version) emits index.js + index_bg.wasm — not shim.mjs.
main = "build/serverless-worker/index.js"
compatibility_date = "2026-09-01"

# NOTE: this repo is a virtual workspace, but worker-build reads a single
# crate manifest — hence the crate path. Out dir is absolute because
# worker-build joins it onto the crate dir.
[build]
command = "worker-build --release --out-dir \"$PWD/build/serverless-worker\" \"$PWD/crates/worker\""

# Plain (non-secret) vars. Secrets NEVER go here — use `wrangler secret put`
# (SECRET_KEY, WORKER_KEY) or scripts/sync-worker.sh.
# NOTE: there is deliberately no TENANT var — one worker IS one tenant and
# engine::TENANT is a compile-time constant. Per-deploy knobs are below.
[vars]
ENVIRONMENT = "production"
HTTP_TIMEOUT_MS = "15000"
# AI assistant backend base URL (fallback when the AI_BASE_URL tenant secret
# is absent). Empty = unconfigured; the /srv/ai/* + /ws routes answer 502
# with setup instructions until set.
AI_TARGET = ""
# Public URL of this worker (no port — Workers route by URL, not host:port).
# Update after first deploy; used for self-referencing webhook callbacks.
WORKER_URL = "https://serverless-worker.<account>.workers.dev"

# Storage = bindings, NOT urls. There is intentionally no DB/HOST/PORT here:
# D1 replaces SRV_DB/SRV_HELIX_URL, R2 replaces SRV_DATA_DIR.
[[d1_databases]]
binding = "DB"
database_name = "serverless-worker"
database_id = "REPLACE_ME_RUN_WRANGLER_D1_CREATE"

[[r2_buckets]]
binding = "STORE"
bucket_name = "serverless-worker-store"

[[durable_objects.bindings]]
name = "TENANT_DO"
class_name = "TenantDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantDO"]

[[analytics_engine_datasets]]
binding = "USAGE"

# Webhook delivery pipeline: the Cron Trigger claims due rows and enqueues
# them; the queue consumer delivers with per-hook HMAC + backoff. Create once
# with `wrangler queues create webhook-deliveries` (Phase 8 ops). Without the
# queue, the scheduler delivers inline (best effort).
[[queues.producers]]
queue = "webhook-deliveries"
binding = "WEBHOOKS"

[[queues.consumers]]
queue = "webhook-deliveries"
max_batch_size = 10
max_batch_timeout = 30

[triggers]
crons = ["*/5 * * * *"]
